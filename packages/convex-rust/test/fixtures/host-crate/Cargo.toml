[package]
name = "host_fixture"
edition = "2021"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The path is rewritten by the test (it builds a copy in a temp dir).
convex_fn = { path = "CONVEX_FN_PATH" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"

# Standalone: not part of the convex-rs workspace.
[workspace]
