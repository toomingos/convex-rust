[package]
name = "convex_fn"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "SDK for writing Convex actions in Rust (\"use rust\")"

[dependencies]
convex_fn_macros.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# Small digest/HMAC run in the guest (a host crypto call costs ~6 us); large ones go to the host.
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "time", "sync", "macros"] }
log_crate = { package = "log", version = "0.4", optional = true }
tracing-core = { version = "0.1", optional = true }

[features]
# `log::Log` impl routing to the host `log` import; installed by the action entry.
log = ["dep:log_crate"]
# Minimal `tracing` subscriber (events + span fields) routing to the host `log` import.
tracing = ["dep:tracing-core"]
# DX-06a spike: run the action on a tokio current_thread runtime (waker-based
# task futures + a host pump).
tokio-rt = ["dep:tokio"]

# Native guests (cfg convex_native, never wasm) allocate through mimalloc.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended", "v2"] }
