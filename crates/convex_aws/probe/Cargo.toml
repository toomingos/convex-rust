# DX-06c wasm probe: aws-sdk-s3 (default features off) in an #[action] on
# wasm32-wasip1 through convex_aws. Standalone workspace. Build:
#   CARGO_TARGET_DIR=<repo>/target-e2e \
#     cargo build --release --target wasm32-wasip1 -p convex_aws_probe
# Test:  cargo test --release -p convex_aws_probe_harness
[workspace]
members = ["harness"]

[package]
name = "convex_aws_probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
convex_fn = { path = "../../convex_fn", features = ["tokio-rt"] }
convex_aws = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
