# DX-06a spike: tokio on wasm32-wasip1 inside a convex_fn action.
# Standalone workspace (not part of the root convex-rs workspace). Build with
#   CARGO_TARGET_DIR=<repo>/target
[workspace]
members = ["harness"]

[package]
name = "tokio_wasip1"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
# Feature-support probes (Q1): each must FAIL to compile on wasm32-wasip1.
f_net = ["tokio/net"]
f_fs = ["tokio/fs"]
f_signal = ["tokio/signal"]
f_process = ["tokio/process"]
f_mt = ["tokio/rt-multi-thread"]
f_full = ["tokio/full"]

[dependencies]
convex_fn = { path = "../../crates/convex_fn", features = ["tokio-rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
convex_fn_test = { path = "../../crates/convex_fn_test" }
