# convex-rs CI: SDK, mock host and benchmark pairs (phase 0). The backend fork in
# vendor/ has its own repo and CI. Nothing here deploys or pushes.
name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix bench
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p bench_rust --target wasm32-wasip1 --release
      - run: cargo test --workspace --release

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix bench
      - run: npx --prefix bench tsc --noEmit -p bench
      - run: node --test bench/shared/
